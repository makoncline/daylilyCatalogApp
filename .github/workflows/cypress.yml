name: End-to-end tests

on: [pull_request]

env:
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    env:
      CYPRESS_ROOT_URL: http://localhost:5678
      CI: true
      CONFIRM_DROP: 1
      NODE_ENV: test
      ENABLE_CYPRESS_COMMANDS: 1

    strategy:
      matrix:
        node-version: [24.22.1]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - "0.0.0.0:5432:5432"
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install PostgreSQL client18
        run: |
          sudo sh docker/install-postgresql-client.sh
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Setup
        run: |
          cp .env.ci .env
          yarn --frozen-lockfile
          yarn setup
          yarn build
      - name: Start server in background
        run: yarn server start &
      - name: Start worker in background
        run: yarn worker start &
      - name: Cypress run
        uses: cypress-io/github-action@v7.4.6
        with:
          wait-on: http://localhost:5678
          working-directory: "@app/e2e"
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: cypress-screenshots
          path: "@app/e2e/cypress/screenshots"
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: cypress-videos
          path: "@app/e2e/cypress/videos"
